<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos Veterinarios - VECOL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container my-5">
        <h1 class="text-center text-primary fw-bold mb-1">Catálogo de Productos Veterinarios</h1>
        <p class="text-center text-muted mb-4">Datos abiertos de Colombia (datos.gov.co) - VECOL</p>

        <!-- Formulario de Búsqueda -->
        <form method="get" action="/" class="row g-3 justify-content-center mb-4">
            <div class="col-md-6">
                <input type="text" name="q" class="form-control" th:value="${busqueda}" placeholder="Buscar por nombre, especie (ej: Bovinos) o clase...">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Filtrar</button>
            </div>
            <div class="col-md-2" th:if="${busqueda != null && !busqueda.isEmpty()}">
                <a href="/" class="btn btn-secondary w-100">Limpiar</a>
            </div>
        </form>

        <!-- Contador de resultados -->
        <div class="alert alert-info text-center py-2" role="alert">
            Mostrando <strong th:text="${total}">0</strong> productos en el catálogo.
        </div>

        <!-- Tabla de Resultados -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre del Producto</th>
                            <th>Especie</th>
                            <th>Clase</th>
                            <th>Presentación</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${productos}">
                            <td class="fw-semibold" th:text="${p.nombre}">Nombre</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${p.especie}">Especie</span>
                            </td>
                            <td th:text="${p.categoria}">Clase</td>
                            <td th:text="${p.presentacion}">Presentación</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="4" class="text-center py-4 text-muted">No se encontraron productos con los criterios de búsqueda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
